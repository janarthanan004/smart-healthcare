<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Smart Healthcare</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/dashboard">
        🏥 Smart Healthcare
    </a>

    <div>
      <a class="btn btn-light btn-sm me-2 active" href="/dashboard">
        Predict
      </a>

      <a class="btn btn-light btn-sm me-2" href="/appointment">
        Appointment
      </a>

      <a class="btn btn-light btn-sm me-2" href="/history">
        History
      </a>

      <a class="btn btn-danger btn-sm" href="/logout">
        Logout
      </a>
    </div>
  </div>
</nav>


<div class="container mt-4">

    <!-- Error Message -->
    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <!-- Main Card -->
    <div class="card shadow-lg">
        <div class="card-header bg-success text-white">
            <h4>Disease Prediction</h4>
        </div>

        <div class="card-body">

            <form action="/predict" method="POST">

                <!-- Patient Details -->
                <h5 class="mb-3">Patient Details</h5>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <input type="number" name="age" class="form-control" placeholder="Enter Age" required>
                    </div>
                    <div class="col-md-6">
                        <select name="gender" class="form-select">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>

                <!-- Search Bar -->
                <input type="text" id="searchBox" class="form-control mb-3" placeholder="Search symptoms...">

                <!-- Selected Symptoms -->
                <div class="mb-3">
                    <h6>Selected Symptoms:</h6>
                    <ul id="selectedList" class="list-group"></ul>
                </div>

                <!-- Symptom List -->
                <div id="symptomList" class="border rounded p-3" style="height:350px; overflow-y:auto;">

                    {% for symptom in symptoms %}
                        <div class="form-check symptom-item">
                            <input class="form-check-input" type="checkbox" name="symptoms" value="{{ symptom }}">
                            <label class="form-check-label">
                                {{ symptom.replace("_"," ") }}
                            </label>
                        </div>
                    {% endfor %}

                </div>

                <!-- Buttons -->
                <div class="mt-4">
                    <button type="submit" onclick="showLoading()" class="btn btn-primary">
                        Predict Disease
                    </button>
                    <button type="button" onclick="location.reload()" class="btn btn-secondary">
                        Reset
                    </button>
                </div>

                <!-- Loading -->
                <div id="loading" class="mt-3 text-primary" style="display:none;">
                    Analyzing symptoms...
                </div>

            </form>

        </div>
    </div>

</div>

<!-- JavaScript -->
<script>
document.getElementById("searchBox").addEventListener("keyup", function() {
    let filter = this.value.toLowerCase();
    let items = document.getElementsByClassName("symptom-item");

    for (let i = 0; i < items.length; i++) {
        let text = items[i].innerText.toLowerCase();
        if (text.includes(filter)) {
            items[i].style.display = "";
        } else {
            items[i].style.display = "none";
        }
    }
});

let checkboxes = document.querySelectorAll("input[type='checkbox']");
let selectedList = document.getElementById("selectedList");

checkboxes.forEach(cb => {
    cb.addEventListener("change", function() {

        selectedList.innerHTML = "";

        let checked = document.querySelectorAll("input[type='checkbox']:checked");

        checked.forEach(item => {
            let li = document.createElement("li");
            li.className = "list-group-item";
            li.textContent = item.parentElement.innerText.trim();
            selectedList.appendChild(li);
        });

    });
});

function showLoading(){
    document.getElementById("loading").style.display = "block";
}
</script>

</body>
</html>
